[package]
name = "gametracker"
version.workspace = true
edition.workspace = true
license.workspace = true

build = "build.rs"

[[bin]]
name = "gametracker"
path = "src/main.rs"

[dependencies]
gametracker-core = { path = "../core" }
anyhow.workspace = true
chrono.workspace = true
log.workspace = true
env_logger = "0.11"
dirs = "6"
gpui = { package = "gpui-ce", git = "https://github.com/gpui-ce/gpui-ce", rev = "9a82fba4e5f1f9194a5489b7a417d164083dd67a" }
gpui_platform = { package = "gpui_ce_platform", git = "https://github.com/gpui-ce/gpui-ce", rev = "9a82fba4e5f1f9194a5489b7a417d164083dd67a", features = ["font-kit", "wayland", "x11"] }
gpui_elements = { package = "gpui_ce_elements", git = "https://github.com/gpui-ce/gpui-ce", rev = "9a82fba4e5f1f9194a5489b7a417d164083dd67a" }

[target.'cfg(windows)'.dependencies]
tray-icon = "0.26"

[build-dependencies]
embed-resource = "3"
