name: Windows-Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test -p gametracker-core
      - name: Release-Build
        run: cargo build --release -p gametracker
      - uses: actions/upload-artifact@v4
        with:
          name: GameTracker-Windows
          path: target/release/gametracker.exe
